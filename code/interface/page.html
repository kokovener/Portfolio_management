<title>Portefeuille PLQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --bg:#f8f8fa;--card:#fff;--ink:#2e2e36;--ink2:#54545e;--mute:#82828c;--line:#e4e4e9;--line2:#f1f1f4;
  --navy:#00405e;--blue:#0070a8;--blue-h:#005982;--cyan:#2fa8c7;--mist:#e4f2f8;--mist-b:#c2e4ef;
  --gold:#ddb76b;--gold-t:#f6ecd6;--gold-ink:#7d6a35;--green:#aeba5c;--green-t:#eef1da;--green-ink:#6b7730;
  --ok:#5b9e5b;--warn:#d8932f;--bad:#c2473b;--bad-t:#fdecea;--today:#c2410c;--idle:#cfcfd6;
  --on-tile:#fff;--on-terroir:#00405e;--shadow:0 1px 2px rgba(0,64,94,.06);
  --plan:#c2e4ef;--plan-b:#8ed0e2;--plan-ink:#00405e;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  /* R25: PLQ dark — deep brand navy grounds (navy-900 family), cyan-500 accent, terroir blocks kept at brand value */
  --bg:#001b29;--card:#002536;--ink:#e8f1f6;--ink2:#b9cfdb;--mute:#86a3b4;--line:#0f3a52;--line2:#082f44;
  --navy:#8ed0e2;--blue:#2fa8c7;--blue-h:#54bcd6;--cyan:#54bcd6;--mist:#0a3a54;--mist-b:#145a7c;
  --gold:#ddb76b;--gold-t:#2f2a1a;--gold-ink:#ecd6a6;--green:#aeba5c;--green-t:#232a14;--green-ink:#cfd79b;
  --ok:#72b872;--warn:#e6a54f;--bad:#ef7b6f;--bad-t:#3a1d1a;--today:#ff8a4c;--idle:#3f5a6a;
  --on-tile:#fff;--on-terroir:#002536;--shadow:0 1px 2px rgba(0,0,0,.35);
  --plan:#0f4a68;--plan-b:#2a7aa0;--plan-ink:#e8f1f6;}}
:root[data-theme="dark"]{
  /* R25: PLQ dark — deep brand navy grounds (navy-900 family), cyan-500 accent, terroir blocks kept at brand value */
  --bg:#001b29;--card:#002536;--ink:#e8f1f6;--ink2:#b9cfdb;--mute:#86a3b4;--line:#0f3a52;--line2:#082f44;
  --navy:#8ed0e2;--blue:#2fa8c7;--blue-h:#54bcd6;--cyan:#54bcd6;--mist:#0a3a54;--mist-b:#145a7c;
  --gold:#ddb76b;--gold-t:#2f2a1a;--gold-ink:#ecd6a6;--green:#aeba5c;--green-t:#232a14;--green-ink:#cfd79b;
  --ok:#72b872;--warn:#e6a54f;--bad:#ef7b6f;--bad-t:#3a1d1a;--today:#ff8a4c;--idle:#3f5a6a;
  --on-tile:#fff;--on-terroir:#002536;--shadow:0 1px 2px rgba(0,0,0,.35);
  --plan:#0f4a68;--plan-b:#2a7aa0;--plan-ink:#e8f1f6;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Montserrat,system-ui,sans-serif;font-size:14px;line-height:1.4}
a{color:var(--blue)}a:hover{color:var(--blue-h)}
button,input,select,textarea{font-family:inherit}
.wrap{max-width:1400px;margin:0 auto;padding:20px 16px 40px;display:flex;flex-direction:column;gap:16px}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--cyan)}
h1{margin:0;font-size:26px;font-weight:800;color:var(--navy);letter-spacing:-.02em;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.muted{color:var(--mute);font-size:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:16px;min-width:0}
.card.top{border-top:3px solid var(--blue)}.card.alert{border-top:3px solid var(--warn)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.tabs{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px}
.tab{padding:8px 14px;border-radius:999px;font-weight:600;font-size:13px;color:var(--ink2);background:transparent;border:1px solid transparent;cursor:pointer}
.tab.on{background:var(--navy);color:var(--card)}
.btn{padding:9px 15px;border-radius:999px;font-weight:600;font-size:13px;border:1px solid #0070a8;background:#0070a8;color:#fff;cursor:pointer;text-decoration:none;display:inline-block}
.btn:hover{filter:brightness(.92);color:#fff}.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--blue);border-color:var(--blue)}.btn.ghost:hover{background:var(--mist)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn:focus-visible,.tab:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
.chip{padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--mist);color:var(--navy);white-space:nowrap}
.tag{font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--line2);color:var(--ink2);white-space:nowrap;display:inline-block}
.tag.ok{background:var(--green-t);color:var(--green-ink)}.tag.warn{background:var(--gold-t);color:var(--gold-ink)}.tag.bad{background:var(--bad-t);color:var(--bad)}.tag.blue{background:var(--mist);color:var(--navy)}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.tiles.t3c{grid-template-columns:repeat(3,minmax(0,1fr))}
.tile{border-radius:8px;padding:16px 18px;color:var(--on-tile);display:flex;flex-direction:column;gap:4px;min-height:92px;justify-content:flex-end}
.tile b{font-size:32px;font-weight:800;line-height:1;letter-spacing:-.02em}.tile span{font-size:12px;font-weight:500}
.tile[data-act],.stage[data-act]{cursor:pointer}.tile[data-act]:hover{filter:brightness(1.06)}.tile.on{box-shadow:0 0 0 3px var(--cyan)}.stage[data-act]:hover{border-color:var(--blue)}.stage.on{box-shadow:inset 0 0 0 1px var(--blue)}
.tile:focus-visible,.stage:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}.chip.on{display:inline-flex;align-items:center;gap:4px;background:var(--navy);color:var(--card)}.chip.on .tg{color:var(--card)}
/* U20: sprint tiles neutral; a coloured edge only when a threshold is crossed */
.tile.nt{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:var(--shadow)}.tile.nt b{color:var(--navy)}.tile.nt span{color:var(--ink2)}
.tile.nt.warn{border-left:5px solid var(--warn)}.tile.nt.bad{border-left:5px solid var(--bad)}
.t1{background:#0070a8}.t2{background:#005982}.t3{background:var(--gold);color:var(--on-terroir)}.t4{background:var(--green);color:var(--on-terroir)}
.main2{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
.side{display:flex;flex-direction:column;gap:16px;min-width:0}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.rag{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.rag.vert{background:var(--ok)}.rag.jaune{background:var(--warn)}.rag.rouge{background:var(--bad)}.rag.idle{background:var(--idle)}
/* timeline */
.tl{min-width:960px}.tl.wide{min-width:1500px}.tl.wide .trk{background-image:repeating-linear-gradient(to right,var(--line2) 0 1px,transparent 1px calc(100%/26))}
.tlr{display:grid;grid-template-columns:310px minmax(0,1fr);align-items:stretch;border-bottom:1px solid var(--line2)}
.lab{padding:5px 10px;min-height:44px;display:flex;align-items:center;gap:8px;overflow:hidden;white-space:nowrap}
.lab .tx{display:flex;flex-direction:column;min-width:0;line-height:1.25}
.lab a,.lab .nm{font-weight:600;text-decoration:none;overflow:hidden;text-overflow:ellipsis}
/* U10: full item name on up to two lines (wider label column) */
.lab a{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.2;overflow-wrap:anywhere}
.lab small{color:var(--mute);font-size:11px;overflow:hidden;text-overflow:ellipsis}
.trk{position:relative;min-height:44px;background-image:repeating-linear-gradient(to right,var(--line2) 0 1px,transparent 1px calc(100%/13))}
.grp{padding:12px 10px 4px;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);border-bottom:1px solid var(--line)}
.wk{display:flex;font-size:11px;color:var(--mute);font-variant-numeric:tabular-nums}.wk span{flex:1;text-align:center;padding:6px 0}
.wk span.now{color:var(--today);font-weight:700}
.sp{position:absolute;top:6px;bottom:6px;font-size:11px;font-weight:600;color:var(--navy);background:var(--mist);border:1px solid var(--mist-b);border-radius:4px;display:flex;align-items:center;justify-content:center;overflow:hidden;white-space:nowrap;padding:0 4px}
.sp.conge{background:var(--gold-t);border-color:var(--gold);color:var(--gold-ink)}
.bar{position:absolute;top:12px;height:20px;border-radius:6px;display:flex;align-items:center;padding:0 8px;font-size:11px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden}
.b-dev{background:#0070a8}.b-ana{background:#1f8fb0}.b-flow{background:var(--green);color:var(--on-terroir)}
/* R26: solid bars — planned = brand tint bar, actual = brand-blue strip under it, open end = perforated edge (no fade) */
.b-plan{top:6px;height:22px;background:var(--plan);color:var(--plan-ink);box-shadow:inset 0 0 0 1px var(--plan-b)}.b-derive{background:transparent;box-shadow:none;outline:1.5px dashed var(--plan-b);outline-offset:-1.5px}.b-real{top:31px;height:6px;padding:0;border-radius:3px;background:var(--blue)}.b-real.b-late{background:var(--bad)}
.b-run{background:repeating-linear-gradient(135deg,var(--idle) 0 4px,transparent 4px 8px);color:var(--ink2);border:1px solid var(--idle)}
.b-idea{background:transparent;border:1px dashed var(--mute);color:var(--ink2)}.b-open{border-top-right-radius:0;border-bottom-right-radius:0}.b-open::after{content:'';position:absolute;right:0;top:0;bottom:0;width:8px;background:repeating-linear-gradient(90deg,transparent 0 2px,var(--card) 2px 4px)}
.ms{position:absolute;top:10px;width:14px;height:14px;margin-left:-7px;transform:rotate(45deg);background:var(--navy);border:2px solid var(--card);cursor:default}
.msn{position:absolute;top:2px;margin-left:4px;min-width:15px;height:15px;padding:0 3px;border-radius:999px;background:var(--navy);color:var(--card);font-size:10px;font-weight:700;line-height:15px;text-align:center;z-index:2;cursor:default}
.ms.warn{background:var(--warn)}.ms.bad{background:var(--bad)}.ms.done{background:var(--ok)}
.fer{position:absolute;top:0;bottom:0;background:var(--gold);opacity:.22;min-width:3px;cursor:help;z-index:0}.fer:hover{opacity:.45}
.now-line{position:absolute;top:0;bottom:0;width:2px;background:var(--today);opacity:.75;pointer-events:none}
.legend{font-size:12px;color:var(--mute)}
.goal{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:10px;padding:12px 16px}.goal p{margin:4px 0 0;font-size:16px;font-weight:600;color:var(--navy)}.goal ul{margin:6px 0 0;padding-left:20px;font-size:14px;font-weight:600;color:var(--navy)}
.fr{font-size:10px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--mute);padding:1px 6px;border:1px solid var(--line);border-radius:999px;white-space:nowrap;cursor:help}.fr.bad{color:var(--bad);border-color:var(--bad)}
.mepg{display:flex;align-items:center;gap:6px;font-size:13px;padding:4px 0;border-top:1px solid var(--line2);cursor:pointer}
.raglg{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;font-size:12px;color:var(--ink2);padding:8px 12px;background:var(--card);border:1px solid var(--line);border-radius:10px}
.srclnk{color:var(--blue);text-decoration:underline;word-break:break-all}
.raglg.in{background:transparent;border:none;border-top:1px solid var(--line2);border-radius:0;padding:8px 0 0;margin-top:8px;font-size:11px}
.raglg>span{display:inline-flex;align-items:center;gap:6px}.raglg .muted{margin-left:auto}
.raglg.line{background:transparent;border:none;padding:0 2px;gap:4px 14px;font-size:12px}.raglg.line>span[title]{cursor:help}.raglg.line.in{border-top:1px solid var(--line2);padding-top:8px;font-size:11px}
.tg{width:18px;height:18px;flex:none;border:none;background:transparent;color:var(--mute);cursor:pointer;padding:0;font-size:11px;line-height:18px;border-radius:4px}
.tg:hover{background:var(--line2);color:var(--navy)}.tg.sp0{cursor:default;visibility:hidden}
.grp .tg{margin-right:4px}.grp{display:flex;align-items:center;cursor:pointer}
.lnk-off{opacity:.6;cursor:not-allowed}
.dh{width:16px;height:22px;flex:none;border:none;background:transparent;color:var(--mute);cursor:grab;padding:0;font-size:14px;line-height:22px;border-radius:4px;opacity:.45}.dh:hover,.dh:focus-visible{opacity:1;background:var(--line2);color:var(--navy)}.dh.sp0{visibility:hidden}
.tlr.drop-before{box-shadow:inset 0 2px 0 var(--blue)}.tlr.drop-after{box-shadow:inset 0 -2px 0 var(--blue)}.tlr.dragging{opacity:.4}
.jbar{display:flex;height:10px;border-radius:999px;overflow:hidden;background:var(--line2);margin:6px 0 4px}.jbar span{display:block;height:100%}
.ptab{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}.ptab th{text-align:left;color:var(--mute);font-weight:600;padding:4px 6px;border-bottom:1px solid var(--line)}
.ptab td{padding:5px 6px;border-bottom:1px solid var(--line2)}.ptab td.n{text-align:right;font-variant-numeric:tabular-nums}.ptab tr.hors td{color:var(--mute);font-style:italic}
/* lists */
.lrow{display:grid;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line2);font-size:13px}
.lrow:last-child{border-bottom:none}
.role{grid-template-columns:96px 1fr 104px;font-size:12px}
.track{height:10px;background:var(--line2);border-radius:999px;overflow:hidden}.fill{height:100%;border-radius:999px;background:var(--blue)}
.fill.warn{background:var(--warn)}.fill.bad{background:var(--bad)}
.risk{grid-template-columns:32px 1fr;font-size:12px;align-items:start}
.score{font-weight:700;color:#fff;border-radius:4px;text-align:center;padding:2px 0;font-size:11px}
.s-bad{background:var(--bad)}.s-warn{background:var(--warn)}.s-low{background:var(--gold);color:var(--on-terroir)}
ul.al{margin:8px 0 0;padding-left:0;list-style:none;font-size:12px;display:flex;flex-direction:column;gap:6px}
ul.al summary{cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}ul.al details[open] summary{white-space:normal}
.funnel{display:flex;gap:6px;flex-wrap:wrap}.stage{flex:1;min-width:110px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.stage b{font-size:22px;font-weight:800;color:var(--navy)}.stage span{font-size:12px;color:var(--ink2)}.stage.on{border-color:var(--blue)}
.kv{display:grid;grid-template-columns:120px 1fr;gap:6px 12px;font-size:13px;margin:10px 0 0}.kv dt{color:var(--mute)}.kv dd{margin:0;font-weight:500;min-width:0}
.modal-bg{position:fixed;inset:0;z-index:20;background:rgba(0,27,41,.55);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto}
.modal{background:var(--bg);border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.35);width:min(720px,100%);padding:16px}.modal .card{box-shadow:none}
.modal-t{margin:0;font-size:18px;color:var(--navy)}.tg.modal-x{width:30px;height:30px;font-size:16px;line-height:30px}
.cbar{display:grid;grid-template-columns:minmax(60px,1fr) 46px;gap:6px;align-items:center;min-width:110px}.cbar small{text-align:right;font-variant-numeric:tabular-nums}
.tempo{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:2px 0}.tempo-b{display:flex;flex-direction:column;gap:3px;width:160px}.tempo-b .track{height:6px}
.bnr{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-radius:10px;border:1px solid var(--line);border-left:5px solid var(--idle);background:var(--card);font-size:13px}.bnr .rag{margin-top:4px}
.bnr.rouge{border-left-color:var(--bad);background:var(--bad-t)}.bnr.jaune{border-left-color:var(--warn);background:var(--gold-t)}.bnr.vert{border-left-color:var(--ok)}.bnr-a{color:var(--ink2);font-weight:600}
/* U17: read-only stepper (chevrons), not tabs */
.steps{display:flex;gap:0;list-style:none;margin:0;padding:0;cursor:default;user-select:none}
.step{flex:1;padding:6px 10px 6px 20px;text-align:center;font-size:12px;font-weight:600;color:var(--mute);background:var(--line2);clip-path:polygon(0 0,calc(100% - 10px) 0,100% 50%,calc(100% - 10px) 100%,0 100%,10px 50%);margin-right:-6px}
.step:first-child{clip-path:polygon(0 0,calc(100% - 10px) 0,100% 50%,calc(100% - 10px) 100%,0 100%);padding-left:10px}
.step.done{color:var(--navy);background:var(--mist)}.step.on{color:var(--card);background:var(--navy)}
.jal{grid-template-columns:20px 1fr auto auto}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--idle);background:var(--card);justify-self:center}
.dot.fait{background:var(--ok);border-color:var(--ok)}.dot.a_risque,.dot.depasse{border-color:var(--warn)}.dot.en_cours{background:var(--blue);border-color:var(--blue)}
.prov{font-size:10px;color:var(--mute);font-weight:500}
.field{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink2);min-width:0}
.field input,.field select,.field textarea{font-size:13px;padding:8px 10px;border:1px solid var(--idle);border-radius:8px;background:var(--card);color:var(--ink);width:100%}
.f2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.f3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
form.g{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.ro{font-size:12px;display:grid;grid-template-columns:110px 1fr;gap:4px 10px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.ro dt{color:var(--mute)}.ro dd{margin:0;overflow-wrap:anywhere;min-width:0}
.kv dd,.muted,.prov{overflow-wrap:anywhere}
.gtabs{display:flex;gap:4px;flex-wrap:wrap;margin-top:10px}
.gtabs button{font-size:12px;padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink2);cursor:pointer;font-weight:600}
.gtabs button.on{background:var(--mist);border-color:var(--mist-b);color:var(--navy)}
.av{display:inline-flex;width:24px;height:24px;border-radius:50%;background:var(--mist);color:var(--navy);font-size:10px;font-weight:700;align-items:center;justify-content:center;margin-right:2px}
.slot{padding:4px 8px;border-radius:6px;font-size:11px;font-weight:600;background:var(--mist);color:var(--navy);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--navy);color:var(--card);padding:10px 16px;border-radius:10px;font-size:13px;font-weight:600;box-shadow:0 4px 16px rgba(0,0,0,.2);z-index:10;max-width:calc(100% - 32px)}
.toast.err{background:var(--bad);color:#fff}
.empty{font-size:12px;color:var(--mute);padding:8px 0}
.crumb{font-size:12px;color:var(--mute)}.crumb a{text-decoration:none}
.err-list{margin:6px 0 0;padding-left:18px;font-size:12px;color:var(--bad)}
/* v15: project Gantt (fiche projet, bottom) — rebuilt from the Gantt file's data, never a copied picture */
.gwrap{overflow-x:auto;margin-top:10px;border-top:1px solid var(--line)}
.gtr{display:grid;grid-template-columns:300px minmax(0,1fr);border-bottom:1px solid var(--line2)}
.gtl{padding:3px 10px;font-size:12px;display:flex;gap:6px;align-items:center;min-width:0;white-space:nowrap}
.gtl .nm{overflow:hidden;text-overflow:ellipsis}.gtl .ref{font-size:10px;font-weight:700;color:var(--mute);flex:none;min-width:58px}
.gtk{position:relative;min-height:24px}
.gtr.g .gtl{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);padding-top:8px}
.gsw{width:10px;height:10px;border-radius:3px;flex:none}
.gtr.h .gtk{display:flex;font-size:10px;color:var(--mute);font-variant-numeric:tabular-nums}.gtr.h .gtk span{flex:1;text-align:left;padding:6px 0 4px 3px;border-left:1px solid var(--line);white-space:nowrap;overflow:hidden}
.gb{position:absolute;top:5px;height:14px;border-radius:4px;min-width:3px}.gb.crit{box-shadow:0 0 0 2px var(--bad)}.gb.fait{opacity:.45}
.gms{position:absolute;top:6px;width:12px;height:12px;margin-left:-6px;transform:rotate(45deg);background:var(--navy);border:2px solid var(--card)}.gms.fait{background:var(--ok)}

<div id="app" class="wrap"><p class="muted">Chargement du portefeuille…</p></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>/*__SCHEMA__*/</script>
<script>/*__CORE__*/</script>
<script>
/* Portfolio PLQ — interface (model v2: Jira epics, ranks, Jira data, support from STG21 links).
 * Reads the artifact `db` (one collection per model entity, doc_id = id), computes health/alerts live
 * with PortfolioCore, and writes only portfolio-owned fields (model v2 §3) from the "Gérer" panel.
 * Gérer is hidden when user.canEdit() is false; db rules restrict writes to the owner (D20).
 */
(function () {
  'use strict';
  const C = window.PortfolioCore;
  const SCHEMA = window.PORTFOLIO_SCHEMA;
  const CADENCE = window.PORTFOLIO_CADENCE || { blocs: [] };
  const ROLE_FR = { pm: 'PM', architecte: 'Architecte', ba: 'BA', af: 'AF', ux: 'UX', dev: 'Dev', qa: 'QA', coordo: 'Coordo', expert: 'Expert', claude: 'Claude', super_utilisateur: 'Super-utilisateurs', direction: 'Direction', cdp: 'CDP' };
  const ETAPES = [['idee', 'Idée'], ['qualifie', 'Qualifié'], ['planifie', 'Planifié'], ['actif', 'Actif'], ['termine', 'Terminé']];
  const STATUT_J = { fait: ['fait', 'ok'], en_cours: ['en cours', 'blue'], a_venir: ['à venir', ''], a_risque: ['à risque', 'warn'], depasse: ['dépassé', 'bad'] };
  const STATUT_MEP = { planifiee: ['planifiée', ''], prete: ['prête', 'ok'], completee: ['complétée', 'ok'], annulee: ['annulée', 'bad'] };
  const JIRA_URL = 'https://jira-plq.atlassian.net/browse/';
  const SYS_FR = { sharepoint: 'SharePoint', smartsheet: 'Smartsheet', jira: 'Jira', jsm: 'JSM', artefact: 'Artefact', outlook: 'Outlook', miro: 'Miro', ledger: 'Ledger', teams: 'Teams', saisie: 'Saisie', calcul: 'Calcul' };

  const S = {
    base: C.emptyBase(), ix: C.index(C.emptyBase()), today: C.todayIso(), view: 'portefeuille', itemId: null, creating: false,
    sprintId: null, canEdit: false, ownerEdit: false, visitor: false, full: C.emptyBase(), db: null, status: 'chargement', diag: [], filters: { voie: 'toutes', etape: 'ap', horizon: 'avenir' }, focus: null,
    gerer: { tab: 'item', id: null }, ganttTab: {}, modal: false, loadedAt: null, errors: [], toggled: loadToggled()
  };

  // ---------- accordion state (feedback R07): per-viewer convenience, browser storage may be unavailable ----------
  function loadToggled() { try { return new Set(JSON.parse(localStorage.getItem('plq.toggled') || '[]')); } catch (e) { return new Set(); } }
  function saveToggled() { try { localStorage.setItem('plq.toggled', JSON.stringify([...S.toggled])); } catch (e) { /* ignore */ } }
  // Groups (programmes) are open by default; items with children are closed by default.
  // R15/R19: MEP themes are closed by default except Goutte 2.1
  // R49: the « Qualifiés et en pause » and « Terminés » parts are folded by default (toggled = opened)
  const FOLDED_GRP = ['grp:qual', 'grp:term'];
  function isOpen(id) { return (id.startsWith('grp:') && !FOLDED_GRP.includes(id)) || id === 'mep:g21' ? !S.toggled.has(id) : S.toggled.has(id); }

  // ---------- utils ----------
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const $ = (sel) => document.querySelector(sel);
  const itemNom = (id) => (S.ix.items[id] || { nom: id || '—' }).nom;
  const initials = (n) => String(n || '?').split(/[\s-]+/).filter(Boolean).map((w) => w[0]).slice(0, 2).join('').toUpperCase();
  const prov = (src) => src ? `${SYS_FR[src.systeme] || src.systeme}${src.ref ? ' · ' + src.ref : ''} · lu ${C.fmtTs(src.lu_le)}${src.par ? ' · ' + src.par : ''}` : '—';
  // R39: web URLs inside a provenance become links (new tab); the rest stays text. Input is escaped first.
  const linkify = (h) => h.replace(/https?:\/\/[^\s<"]+/g, (u) => `<a class="srclnk" href="${u}" target="_blank" rel="noopener noreferrer">${u} ↗</a>`);
  // U05: business wording on screen (system · read time · web link); row ids, adapter names and authors move to the hover
  const provHtml = (src) => { if (!src) return '—'; const urls = String(src.ref || '').match(/https?:\/\/[^\s<"]+/g) || [];
    return `<span title="${esc('Détails techniques : ' + prov(src))}">${esc(`${SYS_FR[src.systeme] || src.systeme} · lu ${C.fmtTs(src.lu_le)}`)}</span>${urls.map((u) => ' · ' + linkify(esc(u))).join('')}`; };
  const isSaisie = (r) => r && r.source && r.source.systeme === 'saisie';
  function toast(msg, err) { const t = $('#toast'); t.className = 'toast' + (err ? ' err' : ''); t.textContent = msg; clearTimeout(toast.h); toast.h = setTimeout(() => { t.className = ''; t.textContent = ''; }, err ? 7000 : 3500); }
  function santeOf(item) { return C.sante(S.base, item, S.today); }
  // R06: a phase deduced from children is shown as such (model v3 phase_deduite)
  function phaseLbl(i) { return i.phase_source ? i.phase_source + (i.phase_deduite ? ' (déduite)' : '') : ''; }
  function ragCls(item) { return ['idee', 'qualifie'].includes(item.etape) ? 'idle' : santeOf(item).couleur; }

  // ---------- db access (shape-tolerant: the snapshot API is read defensively) ----------
  function unwrap(d) {
    let v = typeof d.data === 'function' ? d.data() : (d.data !== undefined && typeof d.data === 'object' ? d.data : d);
    if (v && typeof v === 'object' && !v.id && d.id) v = Object.assign({}, v, { id: d.id });
    return v;
  }
  async function readCollection(name) {
    const col = S.db.collection(name);
    let snap;
    if (typeof col.get === 'function') snap = await col.get();
    else if (typeof col.onSnapshot === 'function') snap = await new Promise((res, rej) => { const u = col.onSnapshot((s) => { try { u && u(); } catch (e) { /* ignore */ } res(s); }, rej); });
    else throw new Error('collection API inconnue');
    const arr = Array.isArray(snap) ? snap : (snap && (snap.docs || snap.items || snap.documents)) || [];
    return arr.map(unwrap).filter((r) => r && r.id);
  }
  async function load() {
    if (!S.db) return;
    const t0 = performance.now(); const base = C.emptyBase(); const diag = [];
    await Promise.all(C.COLLECTIONS.map(async (c) => {
      try { base[c] = await readCollection(c); diag.push(`${c}: ${base[c].length}`); } catch (e) { diag.push(`${c}: ERREUR ${e && (e.code || e.message)}`); }
    }));
    S.full = base; applyView(); S.loadedAt = C.nowTs(); S.status = 'ok';
    S.diag = [`lu en ${Math.round(performance.now() - t0)} ms · canEdit=${S.canEdit}`].concat(diag.sort());
    if (!S.sprintId || !S.ix.sprints[S.sprintId]) { const a = C.sprintAt(base, S.today) || base.sprints[0]; S.sprintId = a ? a.id : null; }
    render();
  }
  // R37/R38: visitors (and the owner in visitor view) see the public base — hidden items filtered out (display only, D20 v3)
  function applyView() { S.base = S.canEdit ? S.full : C.publicBase(S.full); S.ix = C.index(S.base); }
  async function write(col, rec) {
    const errs = C.validate(SCHEMA, C.DEF_OF[col], rec);
    if (rec.sante) errs.push('santé : calculée, jamais saisie');
    if (errs.length) { S.errors = errs; render(); toast('Refusé par le modèle : ' + errs[0], true); return false; }
    try {
      await S.db.doc(`${col}/${rec.id}`).set(rec);
    } catch (e) { toast(`Écriture refusée (${e && (e.code || e.message)})`, true); return false; }
    S.errors = []; toast('Enregistré dans la base du portefeuille');
    await load(); return true;
  }

  // R09: move an item among its displayed siblings; ranks 1..n are written on the siblings whose rank changes.
  function siblingsOf(it) { return S.base.items.filter((i) => (i.parent || null) === (it.parent || null) && i.type !== 'programme' && !['idee', 'qualifie'].includes(i.etape) && (it.parent || i.type !== 'programme')).sort(C.bySiblingOrder); }
  // R17: drag and drop (handle at the start of the row) — drop before / after a sibling; ↑ ↓ on the handle as keyboard path
  function move(id, d) {
    const it = S.ix.items[id]; if (!it) return; const sib = siblingsOf(it); const k = sib.findIndex((i) => i.id === id); const j = k + d;
    if (k < 0 || j < 0 || j >= sib.length) return; return reorder(id, sib[j].id, d > 0);
  }
  async function reorder(id, targetId, after) {
    const it = S.ix.items[id]; if (!it || !S.canEdit || id === targetId) return;
    const sib = siblingsOf(it); if (!sib.some((i) => i.id === targetId)) { toast('Déplacement possible seulement dans la même section', true); return; }
    const rest = sib.filter((i) => i.id !== id); const t = rest.findIndex((i) => i.id === targetId);
    rest.splice(after ? t + 1 : t, 0, it); sib.splice(0, sib.length, ...rest);
    const changed = sib.map((i, n) => Object.assign({}, i, { rang: n + 1 })).filter((i, n) => S.ix.items[i.id].rang !== n + 1);
    for (const rec of changed) {
      delete rec.sante; const errs = C.validate(SCHEMA, 'item', rec);
      if (errs.length) { toast('Refusé par le modèle : ' + errs[0], true); return; }
    }
    try { for (const rec of changed) await S.db.doc(`items/${rec.id}`).set(rec); } catch (e) { toast(`Écriture refusée (${e && (e.code || e.message)})`, true); return; }
    toast(`Ordre enregistré · ${changed.length} item${changed.length > 1 ? 's' : ''}`); await load();
  }

  // R36: freshness of a page block (cadence.json): "lu il y a …" and "périmé" beyond its target
  function freshTag(ref) {
    const f = C.fraicheurBloc(S.base, CADENCE, ref, S.today); if (!f) return '';
    const age = (ts) => { const n = C.daysBetween(ts.slice(0, 10), S.today); return n <= 0 ? 'auj.' : n === 1 ? 'hier' : `il y a ${n} j`; };
    const tip = f.entrees.map((e) => `${e.a} : ${e.lu_le ? 'lu ' + C.fmtTs(e.lu_le) + (e.cible ? ` · cible ${e.cible.jours_ouvres ? e.cible.jours_ouvres + ' j ouvré' : e.cible.jours + ' j'}` : ' · à la demande') : 'jamais lu'}${e.perime ? ' · PÉRIMÉ' : ''}`).join('\n');
    return ` <span class="fr${f.perime ? ' bad' : ''}" title="${esc(f.nom + '\n' + tip)}">${f.lu_le ? 'lu ' + age(f.lu_le) : 'jamais lu'}${f.perime ? ' · périmé' : ''}</span>`;
  }
  // R16: health legend always visible under the header (D8 rules in plain words)
  // R42: on the sprint view the legend sits inside the « Items dans le sprint » card (compact), not under the header
  function ragLegend(compact) {
    const L = [['rouge', 'Rouge', 'jalon dépassé · risque ≥ 15 · ni Smartsheet ni Jira depuis > 15 j ouvrés'], ['jaune', 'Orange', 'risque ≥ 10 · attente d\u2019un tiers > 5 j ouvrés'],
      ['vert', 'Vert', 'rien à signaler'], ['idle', 'Gris', 'candidat ou en pause']];
    // U02: one compact line everywhere (still always visible, R16); the rule of each colour is on hover
    return `<div class="raglg line${compact ? ' in' : ''}" role="note" aria-label="Légende de la santé">${L.map(([c, n, t]) => `<span title="${esc(n + ' : ' + t)}" aria-label="${esc(n + ' : ' + t)}"><span class="rag ${c}"></span>${n}</span>`).join('')}<span class="muted">santé calculée · survol d'une couleur = règle, d'une pastille = motif</span></div>`;
  }
  // ---------- header ----------
  function header() {
    const inst = S.base.instantanes.slice().sort((a, b) => b.pris_le.localeCompare(a.pris_le))[0];
    // U06: one freshness line — latest source read, last Monday snapshot, and a red tag when a block's source is stale
    const lus = (S.base.lectures || []).map((l) => l.lu_le).filter(Boolean).sort();
    const perimes = (CADENCE.blocs || []).map((b) => C.fraicheurBloc(S.base, CADENCE, b.ref, S.today)).filter((f) => f && f.perime);
    const fresh = `Données du ${C.fmtTs(lus.length ? lus[lus.length - 1] : S.loadedAt)}${inst ? ` · instantané du lundi ${C.fmtDate(inst.date || inst.pris_le.slice(0, 10))}` : ''}`;
    const stale = perimes.length ? ` <span class="tag bad" title="${esc('Source à relire :\n' + perimes.map((f) => f.nom).join('\n'))}">${perimes.length} bloc${perimes.length > 1 ? 's' : ''} périmé${perimes.length > 1 ? 's' : ''}</span>` : '';
    const nav = [['portefeuille', 'Portefeuille'], ['projet', 'Projet'], ['sprint', 'Sprint']]
      .map(([k, l]) => `<button class="tab${S.view === k ? ' on' : ''}" data-act="view" data-v="${k}" type="button">${l}</button>`).join('');
    // U01: sticky header (short title, tabs, freshness) — stays reachable when a view is scrolled
    return `<header class="hdr between">
      <div style="display:flex;flex-direction:column;gap:0"><span class="eyebrow">PLQ · TI</span>
      <h1 class="hdr-t">Portefeuille PLQ</h1></div>
      <div class="tabs" role="tablist">${nav}</div>
      <div class="row"><span class="muted" title="${esc('Page lue ' + C.fmtTs(S.loadedAt))}">${esc(fresh)}${stale}</span>
      ${S.ownerEdit ? `<button class="btn ghost" type="button" data-act="visitor" aria-pressed="${S.visitor}" title="Voir la page comme l\u2019équipe : sans « Modifier », sans items masqués">${S.visitor ? 'Revenir en vue propriétaire' : 'Vue visiteur'}</button>` : ''}
      ${S.canEdit ? '<button class="btn" type="button" data-act="new-item">+ Ajouter un projet</button>' : `<span class="tag">${S.visitor ? 'vue visiteur' : 'lecture seule'}</span>`}</div></header>
      ${S.view === 'sprint' ? '' : ragLegend()}`;
  }

  // ---------- portfolio view ----------
  // R18: horizon = 13 weeks ahead (default) or the past 13 weeks + 13 ahead
  const past = () => S.filters.horizon === 'passe';
  function hDays() { return past() ? 182 : 91; }
  function hStart() { return past() ? C.addDays(C.mondayOf(S.today), -91) : C.mondayOf(S.today); }
  function pos(date) { return Math.max(0, Math.min(100, 100 * C.daysBetween(hStart(), date) / hDays())); }
  // U09: a tile or a funnel stage filters the grid (flat list of the matching items, cleared from the filter chip)
  const FOCUS_FR = { projets: 'projets et runs actifs', j30: 'items portant un jalon dans les 30 prochains jours', alertes: 'items rattachés à une alerte', idee: 'Idée', qualifie: 'Qualifié', planifie: 'Planifié', actif: 'Actif', termine: 'Terminé' };
  function focusIds() {
    const f = S.focus; if (!f) return null; const np = S.base.items.filter((i) => i.type !== 'programme');
    if (f === 'projets') return new Set(np.filter((i) => i.etape === 'actif').map((i) => i.id));
    if (f === 'j30') return new Set(S.base.jalons.filter((j) => j.statut !== 'fait' && j.date >= S.today && j.date <= C.addDays(S.today, 30)).map((j) => j.item));
    if (f === 'alertes') return new Set(C.alertes(S.base, S.today).map((a) => a.item).filter(Boolean));
    return new Set(np.filter((i) => i.etape === f).map((i) => i.id));
  }
  function visible(i) {
    const f = S.filters;
    if (f.voie !== 'toutes' && i.voie !== f.voie) return false;
    if (f.etape === 'ap') return ['actif', 'planifie', 'idee', 'qualifie'].includes(i.etape);
    if (f.etape === 'nt') return i.etape !== 'termine';
    return true;
  }
  function msHtml(list) {
    // U11: milestones less than or equal to 2 days apart share one diamond (count badge, list on hover)
    const groups = {};
    list.filter((j) => j.date >= hStart() && j.date <= C.addDays(hStart(), hDays())).sort((a, b) => a.date.localeCompare(b.date))
      .forEach((j) => { const ks = Object.keys(groups); const last = ks[ks.length - 1]; const k = last && C.daysBetween(last, j.date) <= 2 ? last : j.date; (groups[k] = groups[k] || []).push(j); });
    return Object.keys(groups).map((k) => {
      const js = groups[k];
      const bad = js.some((j) => j.statut !== 'fait' && (j.statut === 'depasse' || j.date < S.today));
      const warn = js.some((j) => j.statut === 'a_risque' || C.recul(j) >= C.SEUILS.recul_jo);
      const done = js.every((j) => j.statut === 'fait');
      const title = js.map((j) => `${j.nom} · ${j.precision === 'mois' ? 'fin ' : ''}${C.fmtDate(j.date)} · ${(STATUT_J[j.statut] || [j.statut])[0]}${j.fait_le ? ' le ' + C.fmtDate(j.fait_le) : ''}${C.retardGate(j, S.today) ? ' · retard ' + C.retardGate(j, S.today) + ' j ouvrés' : ''}${C.recul(j) ? ' · recul +' + C.recul(j) + ' j ouvrés' : ''}${j.derive ? ' · cascade des livrables' : ''}`).join('\n');
      return `<div class="ms${bad ? ' bad' : warn ? ' warn' : done ? ' done' : ''}" style="left:${pos(k)}%" title="${esc(title)}"></div>${js.length > 1 ? `<span class="msn" style="left:${pos(k)}%" title="${esc(title)}">${js.length}</span>` : ''}`;
    }).join('');
  }
  // R06 part 2: planned window (outline, Smartsheet or cascade) above the actual window (Jira sprints, solid).
  const fd = (x) => C.fmtDate(x, x && x.slice(0, 4) !== S.today.slice(0, 4));
  function span(a, b) { const h0 = hStart(); const h1 = C.addDays(h0, hDays()); if (!a || b < h0 || a > h1) return null; const l = pos(a < h0 ? h0 : a); const r = pos(b > h1 ? h1 : b); return { l, w: Math.max(1.2, r - l) }; }
  function barHtml(i) {
    const h0 = hStart(); const h1 = C.addDays(h0, hDays());
    const cls = ['idee', 'qualifie'].includes(i.etape) ? 'b-idea' : i.type === 'run' ? 'b-run' : i.voie === 'flux' ? 'b-flow' : (i.phase_source && /dev/i.test(i.phase_source)) ? 'b-dev' : 'b-ana';
    if (i.type === 'run') { const n = (i.support || []).reduce((k, x) => k + x.ouverts, 0); const sp = span(h0, h1); return `<div class="bar ${cls} b-open" style="left:${sp.l}%;width:${sp.w}%">${esc(i.support ? `support · ${n} ouverts` : 'run · MEP au fil de l\'eau')}</div>`; }
    const pv = C.fenetrePrevue(S.base, i); const rl = C.fenetreReelle(S.base, i);
    const label = i.contenu_sprint || phaseLbl(i) || (i.etape === 'idee' ? 'fenêtre possible' : '');
    let html = '';
    if (pv) {
      const sp = span(pv.debut, pv.fin || h1);
      if (sp) html += `<div class="bar b-plan${pv.fin ? '' : ' b-open'}${pv.origine === 'enfants' ? ' b-derive' : ''}" style="left:${sp.l}%;width:${sp.w}%" title="${esc(`Prévu${pv.origine === 'enfants' ? ' (cascade des livrables)' : ''} : ${fd(pv.debut)} → ${pv.fin ? fd(pv.fin) : 'non daté'}`)}">${esc(label)}</div>`;
    }
    if (rl) {
      const end = rl.fin || (rl.jusqu_au && rl.jusqu_au > S.today ? rl.jusqu_au : S.today);
      const sp = span(rl.debut, end);
      const late = pv && pv.fin && (rl.fin || end) > pv.fin;
      if (sp) html += `<div class="bar b-real${rl.fin ? '' : ' b-open'}${late ? ' b-late' : ''}" style="left:${sp.l}%;width:${sp.w}%" title="${esc(`Réel Jira (sprints) : ${fd(rl.debut)} → ${rl.fin ? fd(rl.fin) : 'en cours' + (rl.jusqu_au ? ', planifié jusqu\'au ' + fd(rl.jusqu_au) : '')}${late ? ' · dépasse la fin prévue' : ''}`)}"></div>`;
    }
    if (!html && i.fenetre && i.fenetre.debut) { const sp = span(i.fenetre.debut, i.fenetre.fin || h1); if (sp) html = `<div class="bar ${cls}" style="left:${sp.l}%;width:${sp.w}%">${esc(label)}</div>`; }
    return html;
  }
  // Milestones on a row: own milestones + gates cascaded from deliverables when the row has none of its own.
  function rowJalons(i) {
    const own = C.jalonsOf(S.base, i.id);
    const gates = own.some((j) => C.gateOf(j)) ? [] : C.gatesOf(S.base, i, S.today).filter((g) => g.derive);
    return own.concat(gates);
  }
  function itemRow(i, depth, nKids, ctx) {
    const p = C.pct(S.base, i);
    // R49: a root of the « Qualifiés » / « Terminés » parts names its parent, kept in another part of the tree
    const par = ctx && i.parent ? S.ix.items[i.parent] : null;
    const deps = S.base.dependances.filter((d) => C.refItem(S.ix, d.vers) === i.id);
    const age = i.updated_at ? C.daysBetween(i.updated_at.slice(0, 10), S.today) : null;
    const jp = C.jiraOf(S.base, i.id, null).pct;
    const bits = [par && par.type !== 'programme' ? `sous ${par.nom.split(' ')[0]}` : null, phaseLbl(i), p ? `${C.fmtNum(p.valeur)} %` : null, jp !== null ? `Jira ${C.fmtNum(jp)} % tickets` : null, deps.length ? `⛓ ${deps[0].type} ${C.refNom(S.base, S.ix, deps[0].de)}` : null,

  function prochaineAction(m, it) {
    if (/^jalon dépassé/.test(m)) return 'redater ou clore le jalon dans sa source';
    if (/^risque/.test(m)) { const r = S.base.risques.find((x) => x.item === it.id && m.endsWith(x.titre)); return r && r.mitigation ? 'mitigation : ' + r.mitigation : 'définir ou revoir la mitigation'; }
    if (/^fraîcheur/.test(m)) return 'mettre à jour la ligne Smartsheet (ou clore l\u2019item)';
    if (/^attente/.test(m)) return 'relancer le tiers';
    return '';
  }
  function santeBanner(it, san, nx) {
    const c = ragCls(it);
    const lines = c === 'idle' ? [['Candidat ou en pause : pas de santé calculée.', it.etape === 'qualifie' ? 'décider la mise au plan' : 'qualifier l\u2019idée']]
      : san.motifs.length ? san.motifs.map((m) => [m, prochaineAction(m, it)]) : [['Rien à signaler pour la santé.', nx ? `prochain jalon : ${nx.nom} — ${C.fmtDate(nx.date)}` : '']];
    // fresh review: portfolio alerts on this item that are not health reasons (recul, phase, MEP, attente) are shown too
    if (c !== 'idle') C.alertes(S.base, S.today).filter((a) => a.item === it.id && ['recul', 'phase', 'mep', 'attente'].includes(a.kind)).forEach((a) => lines.push([`Alerte ${KFR[a.kind] || a.kind} : ${a.texte}`, KACT[a.kind] || '']));
    return `<div class="bnr ${c}" role="status"><span class="rag ${c}"></span><div><b>${COUL_FR[c] || c}</b>${lines.map(([m, a]) => `<div>${esc(m)}${a ? ` <span class="bnr-a">→ ${esc(a)}</span>` : ''}</div>`).join('')}</div></div>`;
  }
  // U16: the item's sub-deliveries (children) listed in the project — name, health, stage, phase; click opens them
  function livraisons(it) {
    const kids = S.base.items.filter((i) => i.parent === it.id).sort(C.bySiblingOrder); if (!kids.length) return '';
    const et = (k) => (ETAPES.find(([x]) => x === k) || [k, k])[1];
    return `<div class="card"><span class="eyebrow">Livraisons · ${kids.length}</span>
      ${kids.map((k) => { const c = ragCls(k); return `<div class="lrow" style="grid-template-columns:auto minmax(0,1fr) auto"><span class="rag ${c}" title="${esc(santeOf(k).motifs.join('\n') || COUL_FR[c])}"></span><span style="min-width:0"><a href="#" data-act="open-item" data-id="${esc(k.id)}" style="font-weight:600;text-decoration:none">${esc(k.nom)}</a>${phaseLbl(k) ? ` <small class="muted">· ${esc(phaseLbl(k))}</small>` : ''}</span><span class="tag${k.etape === 'actif' ? ' blue' : ''}">${esc(et(k.etape))}</span></div>`; }).join('')}</div>`;
  }
  function viewProjet() {
    if (S.creating) return `<div class="crumb"><a href="#" data-act="view" data-v="portefeuille">Portefeuille</a> › Nouveau projet</div>
      <div class="card top" style="max-width:720px"><span class="eyebrow">Gérer · nouveau projet (saisie)</span>${itemForm(null)}${errorsHtml()}</div>`;
    const it = S.ix.items[S.itemId];
    if (!it) return '<div class="card"><p class="empty">Aucun projet sélectionné. Choisir un projet dans la vue Portefeuille.</p></div>';
    const san = santeOf(it); const p = C.pct(S.base, it); const js = rowJalons(it).sort((x, y) => x.date.localeCompare(y.date));
    const rang = C.rangs(S.base)[it.id]; const rn = C.risqueMaxNote(S.base, it.id);
    const nx = C.prochainJalon(S.base, it.id); const { amont, aval } = depsLines(it);
    const risques = S.base.risques.filter((r) => r.item === it.id); const att = S.base.attentes.filter((a) => a.item === it.id);
    const charges = S.base.charges.filter((c) => c.item === it.id);
    const pers = [...new Set(charges.map((c) => c.personne).filter(Boolean))];
    const abs = S.base.absences.filter((a) => (pers.includes(a.personne) || a.personne === null) && a.fin >= S.today && a.debut <= C.addDays(S.today, 42));
    const insts = S.base.instantanes.flatMap((x) => x.items.filter((y) => y.item === it.id).map((y) => Object.assign({ date: x.date }, y))).sort((a, b) => b.date.localeCompare(a.date));
    const spAct = C.sprintAt(S.base, S.today);
    const parent = it.parent ? S.ix.items[it.parent] : null;
    const stepIdx = ETAPES.findIndex(([k]) => k === it.etape);
    const editBtn = (col, r) => S.canEdit && isSaisie(r) ? ` <button class="btn ghost sm" type="button" data-act="edit" data-col="${col}" data-id="${esc(r.id)}">modifier</button>` : '';
    const srcTag = (r) => r.source ? `<span class="prov" title="${esc(prov(r.source))}">${esc(SYS_FR[r.source.systeme] || r.source.systeme)}</span>` : '<span class="prov">cascade</span>';
    return `
    <div class="crumb"><a href="#" data-act="view" data-v="portefeuille">Portefeuille</a> › ${parent ? `<a href="#" data-act="open-item" data-id="${esc(parent.id)}">${esc(parent.nom)}</a>` : 'Hors programme'} › <span style="color:var(--ink);font-weight:600">${esc(it.nom)}</span></div>
    <div class="between" style="align-items:center">
      <div style="display:flex;flex-direction:column;gap:4px;min-width:0"><span class="eyebrow">${esc(natureLbl(it, parent))}</span>
        <h1><span class="rag ${ragCls(it)}"></span>${esc(it.nom)}${it.visible === false ? ' <span class="tag warn" title="Masqué pour les visiteurs et le digest">masqué</span>' : ''}</h1>
        <span class="muted">Source : ${provHtml(it.source)}</span></div>
      <div class="row">${S.canEdit ? '<button class="btn" type="button" data-act="modal" aria-haspopup="dialog">Modifier</button>' : ''}${spAct ? `<button class="btn ghost" type="button" data-act="open-sprint" data-id="${esc(spAct.id)}">Voir le sprint ${esc(spAct.nom.replace(/^G2\.1 - /, ''))}</button>` : ''}
        ${(it.liens || []).map(lienHtml).join('')}</div>
    </div>
    ${santeBanner(it, san, nx)}
    <ol class="steps" aria-label="Étape du cycle de vie">${ETAPES.map(([k, l], n) => `<li class="step${n < stepIdx ? ' done' : n === stepIdx ? ' on' : ''}"${n === stepIdx ? ' aria-current="step"' : ''}>${n < stepIdx ? '✓ ' : ''}${l}</li>`).join('')}</ol>
    <div class="main2">
      <div class="side">
        <div class="two">
          <div class="card"><span class="eyebrow">Fiche</span><dl class="kv">
            <dt>Responsable</dt><dd>${esc(it.responsable || '—')}</dd>
            <dt>Type · parent</dt><dd>${esc(it.type)} · ${esc(parent ? parent.nom : 'hors programme')}</dd>
            <dt>Priorité</dt><dd>${it.priorite ? `P${rang || '?'} — valeur ${it.priorite.valeur} · urgence ${it.priorite.urgence} · effort ${it.priorite.effort} · risque ${rn ?? '—'} <small class="muted">(score ${C.prioriteScore(it.priorite)})</small>` : 'non évaluée'}</dd>
            ${(() => { const pv = C.fenetrePrevue(S.base, it); const rl = C.fenetreReelle(S.base, it); return `<dt>Prévu</dt><dd>${pv ? `${C.fmtDate(pv.debut)} → ${pv.fin ? C.fmtDate(pv.fin, true) : 'non daté'}${pv.origine === 'enfants' ? ' <small class="muted">(cascade des livrables)</small>' : ''}` : 'non saisi (Smartsheet : Début prévu / Fin prévue)'}</dd><dt>Réel Jira</dt><dd>${rl ? `${C.fmtDate(rl.debut)} → ${rl.fin ? C.fmtDate(rl.fin, true) : 'en cours' + (rl.jusqu_au ? ' (planifié jusqu’au ' + C.fmtDate(rl.jusqu_au) + ')' : '')}${pv && pv.fin && (rl.fin || S.today) > pv.fin ? ' <span class="tag bad">dépasse le prévu</span>' : ''}` : '—'}</dd>`; })()}
            <dt>Prochain jalon</dt><dd>${nx ? `<b>${esc(nx.nom)} — ${C.fmtDate(nx.date)}</b> (${C.daysBetween(S.today, nx.date) >= 0 ? 'dans ' + C.daysBetween(S.today, nx.date) + ' j' : 'dépassé'})` : '—'}</dd>
            <dt>Dépend de</dt><dd>${amont.length ? amont.map((d) => `${esc(C.refNom(S.base, S.ix, d.de))} <span class="tag${C.predecesseurRecule(S.base, S.ix, d.de) ? ' warn' : ''}">${d.type}</span>`).join('<br>') : '—'}</dd>
            <dt>Alimente</dt><dd>${aval.length ? aval.map((d) => `${esc(C.refNom(S.base, S.ix, d.vers))} <span class="tag">${d.type}</span>`).join('<br>') : '—'}</dd>
            ${it.note_lundi ? `<dt>Note du lundi</dt><dd>${esc(it.note_lundi)}</dd>` : ''}
          </dl></div>
          ${dataJira(it, charges, abs)}
        </div>
        ${livraisons(it)}
        <div class="card"><div class="between"><span class="eyebrow">Jalons · ${js.length} (dont ${js.filter((j) => j.statut === 'fait').length} faits)</span>
          <span class="muted">progression ${p ? C.fmtNum(p.valeur) + ' % ' + (p.origine === 'source' ? '(lue à la source)' : '= faits / total') : '—'}</span></div>
          ${js.length ? js.map((j) => { const st = STATUT_J[j.statut] || [j.statut, '']; const rc = C.recul(j); const late = j.statut !== 'fait' && j.date < S.today;
            return `<div class="lrow jal"><div class="dot ${j.statut}"></div><div>${esc(j.nom)} ${srcTag(j)}${editBtn('jalons', j)}</div><span>${j.precision === 'mois' ? 'fin ' : ''}${C.fmtDate(j.date)}${rc ? ` <small class="muted">(init. ${C.fmtDate(j.date_initiale)}, +${rc} j o.)</small>` : ''}</span><span class="tag ${late ? 'bad' : st[1]}">${late ? 'dépassé' : st[0]}${j.fait_le && j.fait_le < j.date ? ' · ' + C.workingDaysBetween(j.fait_le, j.date) + ' j o. d\'avance' : ''}${j.statut === 'fait' && C.retardGate(j, S.today) ? ' · ' + C.retardGate(j, S.today) + ' j o. de retard' : ''}</span></div>`; }).join('') : '<p class="empty">Aucun jalon. Goutte 2.1 : remplir « Date prévue » des gates BA-3, AC-4, QA-2, QA-3 dans Jalons_Entites (ligne cochée Portefeuille) ; sinon les saisir avec « Modifier ».</p>'}
        </div>
        ${(() => { const ms = S.base.meps.filter((m) => m.item === it.id).sort((a, b) => b.date.localeCompare(a.date)); if (!ms.length && !S.canEdit) return '';
          return `<div class="card"><span class="eyebrow">MEP · ${ms.length}</span>${ms.length ? ms.slice(0, 12).map((m) => `<div class="lrow" style="grid-template-columns:90px minmax(0,1fr) auto"><span>${C.fmtDate(m.date)}</span><span style="min-width:0">${esc(m.systeme)} · ${esc(m.libelle || '')} <small class="muted">${esc(m.ticket || 'sans billet')}</small> ${srcTag(m)}${editBtn('meps', m)}</span><span class="tag ${mepPassee(m) ? 'bad' : STATUT_MEP[m.statut][1]}">${mepPassee(m) ? 'non confirmée' : STATUT_MEP[m.statut][0]}</span></div>`).join('') + (ms.length > 12 ? `<p class="muted" style="margin:6px 0 0">${ms.length - 12} plus anciennes : grille du portefeuille.</p>` : '') : '<p class="empty">Aucune MEP rattachée. « Modifier » › « + MEP » pour en saisir une.</p>'}</div>`; })()}
        <div class="two">
          <div class="card"><span class="eyebrow">Risques · ${risques.length}</span>
            ${risques.length ? risques.map((r) => { const s = C.risqueScore(r); return `<div class="lrow" style="grid-template-columns:1fr"><div><span class="tag ${s >= 15 ? 'bad' : s >= 10 ? 'warn' : ''}">P${r.probabilite} · I${r.impact} = ${s}</span> ${r.ouvert === false ? '<span class="tag ok">clos</span> ' : ''}<b>${esc(r.titre)}</b>${r.mitigation ? ` <span class="muted">Mitigation : ${esc(r.mitigation)}</span>` : ''} ${srcTag(r)}${editBtn('risques', r)}</div></div>`; }).join('') : '<p class="empty">Aucun risque.</p>'}</div>
          <div class="card"><span class="eyebrow">Attentes d'un tiers · ${att.filter((a) => !a.recue_le).length} ouvertes</span>
            ${att.length ? att.map((a) => { const late = !a.recue_le ? C.workingDaysBetween(a.attendue_le, S.today) : 0; return `<div class="lrow" style="grid-template-columns:1fr"><div><span class="tag">${esc(a.tiers)}</span> ${esc(a.objet)} — attendue le ${C.fmtDate(a.attendue_le)}${a.recue_le ? ` · <span class="tag ok">reçue ${C.fmtDate(a.recue_le)}</span>` : late > 0 ? ` · <span class="tag ${late > 5 ? 'warn' : ''}">${late} j o. de retard</span>` : ''} ${srcTag(a)}${editBtn('attentes', a)}</div></div>`; }).join('') : '<p class="empty">Aucune attente.</p>'}</div>
        </div>
      </div>
      <div class="side">
        <div class="card"><span class="eyebrow">Sources de ce projet</span>
          ${C.sourcesOf(S.base, it.id).map((s) => `<div class="lrow" style="grid-template-columns:1fr auto"><span title="${esc('Détails techniques : ' + (s.ref || '—'))}">${esc(SYS_FR[s.systeme] || s.systeme)} <small class="muted">· ${s.n} élément${s.n > 1 ? 's' : ''}</small></span><span class="tag ${s.systeme === 'saisie' ? 'blue' : 'ok'}">lu ${esc(C.fmtTs(s.lu_le))}</span></div>`).join('')}</div>
        <div class="card"><span class="eyebrow">Historique · instantanés du lundi</span>
          ${insts.length ? insts.map((x) => `<div class="between" style="font-size:12px;padding:4px 0"><span>${C.fmtDate(x.date)}</span><span>${esc(x.resume || `${x.sante} · ${x.etape}`)}</span></div>`).join('') : '<p class="empty">Aucun instantané : le premier est pris le lundi matin.</p>'}</div>
      </div>
    </div>
    ${ganttCard(it)}
    ${S.canEdit && S.modal ? modalGerer(it) : ''}`;
  }

  // v15: the project's Gantt, rebuilt from the `gantt` record (adaptateur Gantt): one row per task, bars by group colour,
  // critical path outlined, milestone rows as diamonds, today line; tabs when the file has several pages
  const GCOL = ['var(--blue)', 'var(--cyan)', 'var(--green)', 'var(--gold)', 'var(--navy)', '#8a7fc4', '#b87436', '#5b9e5b'];
  function ganttCard(it) {
    const g = (S.base.gantts || []).find((x) => x.item === it.id); if (!g) return '';
    const k = Math.min(S.ganttTab[it.id] || 0, g.onglets.length - 1); const o = g.onglets[k];
    const d0 = C.mondayOf(o.debut); const nW = Math.max(1, Math.ceil((C.daysBetween(d0, o.fin) + 1) / 7)); const nD = nW * 7;
    const P = (s) => Math.max(0, Math.min(100, 100 * C.daysBetween(d0, s) / nD));
    const grid = `background-image:repeating-linear-gradient(to right,var(--line2) 0 1px,transparent 1px ${100 / nW}%)`;
    const now = S.today >= d0 && S.today <= C.addDays(d0, nD - 1) ? `<div class="gnow" style="left:${P(S.today) + 50 / nD}%" title="Aujourd’hui"></div>` : '';
    const age = g.calcule_le ? C.workingDaysBetween(g.calcule_le, S.today) : null;
    const tip = (t) => `${t.ref ? t.ref + ' — ' : ''}${t.nom}\n${C.fmtDate(t.debut)} → ${C.fmtDate(t.fin, true)} · ${C.weekdaysInRange(t.debut, t.fin)} j o.${t.critique ? ' · chemin critique' : ''}${t.jalon ? ' · jalon' : ''}${t.fait ? ' · fait' : ''}`;
    const bar = (t, col) => t.jalon ? `<div class="gms${t.fait ? ' fait' : ''}" style="left:${P(t.fin) + 50 / nD}%" title="${esc(tip(t))}"></div>`
      : (t.segments || [t]).map((s) => `<div class="gb${t.critique ? ' crit' : ''}${t.fait ? ' fait' : ''}" style="left:${P(s.debut)}%;width:${P(C.addDays(s.fin, 1)) - P(s.debut)}%;background:${col}" title="${esc(tip(t))}"></div>`).join('');
    const rows = o.groupes.map((gr, gi) => { const col = GCOL[gi % GCOL.length];
      return `<div class="gtr g"><div class="gtl"><span class="gsw" style="background:${col}"></span>${esc(gr.nom)}</div><div class="gtk" style="${grid}">${now}</div></div>`
        + gr.taches.map((t) => `<div class="gtr"><div class="gtl" title="${esc(tip(t))}"><span class="ref">${esc(t.ref || '')}</span><span class="nm">${esc(t.nom)}</span></div><div class="gtk" style="${grid}">${now}${bar(t, col)}</div></div>`).join(''); }).join('');
    const weeks = Array.from({ length: nW }, (_, i) => `<span>${C.fmtDate(C.addDays(d0, 7 * i))}</span>`).join('');
    const nT = o.groupes.reduce((n, gr) => n + gr.taches.length, 0);
    return `<div class="card"><div class="between"><span class="eyebrow">Gantt du projet${freshTag('B12')}</span>
        <span class="muted">Source : ${provHtml(g.source)}${g.fichier_modifie_le ? ` · fichier du ${esc(C.fmtTs(g.fichier_modifie_le))}` : ''}${g.calcule_le ? ` · plan calculé le ${esc(C.fmtDate(g.calcule_le))}${age > 5 ? ` <span class="tag warn" title="Les dates viennent du calcul du producteur à cette date : à faire recalculer">il y a ${age} j o.</span>` : ''}` : ''}</span></div>
      ${g.onglets.length > 1 ? `<div class="gtabs" role="tablist">${g.onglets.map((x, i) => `<button type="button" role="tab" aria-selected="${i === k}" class="${i === k ? 'on' : ''}" data-act="gantt-tab" data-k="${i}">${esc(x.nom)}</button>`).join('')}</div>` : ''}
      ${o.titre || o.sous_titre ? `<p class="muted" style="margin:8px 0 0">${esc([o.titre, o.sous_titre].filter(Boolean).join(' — '))}</p>` : ''}
      <div class="gwrap"><div style="min-width:${300 + nW * 64}px">
        <div class="gtr h"><div class="gtl"><b>${nT} tâches</b>&nbsp;<span class="muted">· ${C.fmtDate(o.debut)} → ${C.fmtDate(o.fin, true)}</span></div><div class="gtk">${weeks}</div></div>
        ${rows}</div></div>
      <div class="glg"><span><span class="gb crit" style="position:static;display:inline-block;width:18px;background:var(--line)"></span>chemin critique</span><span><span class="gms" style="position:static;margin:0 2px"></span>jalon</span><span><span class="gb fait" style="position:static;display:inline-block;width:18px;background:var(--blue)"></span>fait</span><span><span style="width:2px;height:12px;background:var(--today);display:inline-block"></span>aujourd’hui</span>${o.hors_planning ? `<span class="muted">Hors planning : ${esc(o.hors_planning)}</span>` : ''}</div></div>`;
  }

  // R10: "Data Jira" — the item's epics (Gérer), ticket progress, active-sprint content and points per person;
  // (load entered by hand — WIP, ETP — dropped 2026-10-28, Franck R23 R24 R28)
  function dataJira(it, charges, abs) {
    const sp = C.sprintAt(S.base, S.today);
    const J = C.jiraOf(S.base, it.id, sp && sp.id); const st = J.stat; const ep = it.epics_jira || [];
    const editBtn = (col, r) => S.canEdit && isSaisie(r) ? ` <button class="btn ghost sm" type="button" data-act="edit" data-col="${col}" data-id="${esc(r.id)}">modifier</button>` : '';
    const t = st && st.tickets; const w = (n) => t && t.total ? (100 * n / t.total) + '%' : '0';
    return `<div class="card"><div class="between"><span class="eyebrow">Data Jira${freshTag('B1')}</span>${st ? `<span class="prov" title="${esc(prov(st.source))}">Jira · lu ${esc(C.fmtTs(st.source.lu_le))}</span>` : ''}</div>
      <div class="row" style="margin-top:6px">${ep.length ? ep.map((k) => `<a class="tag blue" href="${JIRA_URL}${esc(k)}" target="_blank" rel="noopener noreferrer">${esc(k)} ↗</a>`).join('') : `<span class="muted">Aucune épopée liée${S.canEdit ? ' — la saisir avec « Modifier » (champ « Épopées Jira »)' : ''}.</span>`}</div>
      ${st ? `<div class="jbar" title="${t.faits} faits · ${t.en_cours} en cours · ${t.a_faire} à faire"><span style="width:${w(t.faits)};background:var(--ok)"></span><span style="width:${w(t.en_cours)};background:var(--blue)"></span></div>
        <div class="between" style="font-size:12px"><span><b>${C.fmtNum(J.pct)} %</b> des tickets faits <small class="muted">(dès « Prêt pour Preprod », annulés exclus)</small></span><span class="muted">${t.faits} faits · ${t.en_cours} en cours · ${t.a_faire} à faire · ${t.total} au total</span></div>
        ${st.sprint ? `<dl class="kv"><dt>${esc((S.ix.sprints[st.sprint.ref] || { nom: st.sprint.ref }).nom.replace(/^G2\.1 - /, ''))} (courant)</dt><dd>${st.sprint.tickets} tâche${st.sprint.tickets > 1 ? 's' : ''} parente${st.sprint.tickets > 1 ? 's' : ''} · ${C.fmtNum(st.sprint.points)} pts équipe · ${st.sprint.faits} faite${st.sprint.faits > 1 ? 's' : ''} (${C.fmtNum(st.sprint.points_faits || 0)} pts)</dd>
          ${J.parPersonne.length ? `<dt>Sous-tâches</dt><dd class="muted">par personne : à faire / total</dd>` : ''}
          ${J.parPersonne.map((p) => `<dt>${esc(p.nom)}</dt><dd>${p.sousTaches - p.faites} / ${p.sousTaches}${p.enCours ? ` · ${p.enCours} en cours` : ''}</dd>`).join('')}</dl>` : ''}`
        : ep.length ? '<p class="empty">Épopées liées, pas encore lues : la lecture Jira du lundi les comptera.</p>' : ''}
      <dl class="kv"><dt>Absences</dt><dd>${abs.length ? abs.map((a) => `${esc(a.personne ? (S.ix.personnes[a.personne] || { nom: a.personne }).nom : a.libelle || 'collective')} ${C.fmtDate(a.debut)}–${C.fmtDate(a.fin)}`).join('<br>') : 'aucune détectée (6 semaines)'}</dd></dl></div>`;
  }

  // ---------- Gérer (owned fields only, model v2 §3) ----------
  function opt(v, l, cur) { return `<option value="${esc(v)}"${String(cur) === String(v) ? ' selected' : ''}>${esc(l)}</option>`; }
  function notes(name, cur) { return `<select name="${name}">${opt('', '—', cur == null ? '' : cur)}${[1, 2, 3, 4, 5].map((n) => opt(n, n, cur)).join('')}</select>`; }
  function errorsHtml() { return S.errors.length ? `<ul class="err-list">${S.errors.map((e) => `<li>${esc(e)}</li>`).join('')}</ul>` : ''; }
  // R31: plain-language nature of an item (type · how it is followed · why it is in the portfolio)
  function natureLbl(it, parent) {
    const t = { programme: 'Programme', projet: 'Projet', run: 'Run (exploitation)' }[it.type] || it.type;
    const v = it.voie === 'scrum' ? 'suivi en sprints Jira' : 'suivi au fil de l\u2019eau, sans sprint';
    const p = it.promu ? (parent ? `sous-livraison de ${parent.nom.split(' ')[0]}` : 'sous-livraison suivie au portefeuille') : null;
    return [t, v, p].filter(Boolean).join(' · ');
  }
  function itemForm(it) {
    const x = it || { type: 'projet', voie: 'flux', etape: 'idee', promu: false };

    const lu = !!(x.source && x.source.systeme === 'smartsheet');
    const ro = (name, label, val, html) => lu ? `<div class="field"><label>${label}<input value="${esc(val)}" disabled title="Lu dans Smartsheet"><input type="hidden" name="${name}" value="${esc(x[name])}"></label><small class="muted">lu dans Smartsheet</small></div>` : html;
    const parents = S.base.items.filter((i) => (i.type === 'programme' || i.type === 'projet') && (!it || i.id !== it.id));
