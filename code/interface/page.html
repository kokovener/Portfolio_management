    return `<form class="g" data-form="item">
      <div class="field"><label>Nom<input name="nom" required value="${esc(x.nom || '')}"></label></div>
      <div class="f3"><div class="field"><label>Type<select name="type">${['programme', 'projet', 'run'].map((v) => opt(v, v, x.type)).join('')}</select></label></div>
        ${ro('voie', 'Suivi', x.voie === 'scrum' ? 'Sprints Jira' : 'Au fil de l\u2019eau', `<div class="field"><label>Suivi<select name="voie">${opt('scrum', 'Sprints Jira (scrum)', x.voie)}${opt('flux', 'Au fil de l\u2019eau (flux)', x.voie)}</select></label></div>`)}
        ${ro('etape', 'Étape', (ETAPES.find(([k]) => k === x.etape) || [0, x.etape])[1], `<div class="field"><label>Étape<select name="etape">${ETAPES.map(([v, l]) => opt(v, l, x.etape)).join('')}</select></label></div>`)}</div>
      <div class="f2"><div class="field"><label>Parent<select name="parent">${opt('', 'hors programme', x.parent || '')}${parents.map((p) => opt(p.id, p.nom, x.parent || '')).join('')}</select></label></div>
        <div class="field"><label>Responsable<input name="responsable" value="${esc(x.responsable || '')}"></label></div></div>
      <div class="f3"><div class="field"><label>Valeur${notes('valeur', pr.valeur)}</label></div><div class="field"><label>Urgence${notes('urgence', pr.urgence)}</label></div><div class="field"><label>Effort${notes('effort', pr.effort)}</label></div></div>
      <div class="f2"><div class="field"><label>Fenêtre — début<input type="date" name="debut" value="${esc((x.fenetre || {}).debut || '')}"></label></div>
        <div class="field"><label>Fenêtre — fin (vide = non datée)<input type="date" name="fin" value="${esc((x.fenetre || {}).fin || '')}"></label></div></div>
      <label style="font-size:12px;display:flex;gap:6px;align-items:center"><input type="checkbox" name="promu"${x.promu ? ' checked' : ''}> sous-livraison suivie au portefeuille (sous son L)</label>
      <label style="font-size:12px;display:flex;gap:6px;align-items:center" title="Décoché : masqué pour les visiteurs et le digest Teams ; filtre d'affichage, pas un droit"><input type="checkbox" name="visible"${x.visible === false ? '' : ' checked'}> visible dans le portefeuille</label>
      <div class="field"><label>Note du lundi<textarea name="note_lundi" rows="2">${esc(x.note_lundi || '')}</textarea></label></div>
      <div class="field"><label>Épopées Jira GOU21 (clés séparées par des virgules)<input name="epics_jira" placeholder="GOU21-9199, GOU21-9604" value="${esc((x.epics_jira || []).join(', '))}"></label></div>
      <div class="field"><label>Liens (une ligne : libellé | url)<textarea name="liens" rows="2">${esc((x.liens || []).map((l) => `${l.libelle} | ${l.url}`).join('\n'))}</textarea></label></div>
      <div class="row"><button class="btn" type="submit">Enregistrer</button>${it ? '' : '<button class="btn ghost" type="button" data-act="view" data-v="portefeuille">Annuler</button>'}</div>
    </form>`;
  }
  // U15 (Franck: « Modifier » opens a modal): Gérer leaves the reading columns; Échap, ✕ or the backdrop close it
  function modalGerer(it) {
    return `<div class="modal-bg" data-act="close-modal"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-t">
      <div class="between"><h2 id="modal-t" class="modal-t">Modifier · ${esc(it.nom)}</h2><button class="tg modal-x" type="button" data-act="close-modal" aria-label="Fermer" title="Fermer (Échap)">✕</button></div>
      ${gerer(it)}</div></div>`;
  }
  function gerer(it) {
    const g = S.gerer; const tabs = [['item', 'Item'], ['jalons', '+ Jalon'], ['risques', '+ Risque'], ['attentes', '+ Attente'], ['dependances', '+ Dépendance'], ['meps', '+ MEP']];
    const rec = g.id ? (S.base[g.tab] || []).find((r) => r.id === g.id) : null;
    let body = '';
    if (g.tab === 'item') {
      body = itemForm(it) + `<dl class="ro"><dt>Santé</dt><dd>${santeOf(it).couleur} · calculée, jamais saisie</dd>
        ${typeof it.pct_avancement === 'number' ? `<dt>% avancement</dt><dd>${C.fmtNum(it.pct_avancement)} % · ${provHtml(it.source)}</dd>` : ''}
        ${it.phase_source ? `<dt>Phase source</dt><dd>${esc(phaseLbl(it))}${it.phase_deduite ? ' (phase vide dans la feuille : la moins avancée des enfants actifs)' : ''} · ${provHtml(it.source)}</dd>` : ''}
        ${it.contenu_sprint ? `<dt>Contenu sprint</dt><dd>${esc(it.contenu_sprint)} · ${provHtml(it.source)}</dd>` : ''}
        ${it.support ? `<dt>Support</dt><dd>${it.support.length} extranets · ${provHtml(it.source)}</dd>` : ''}
        <dt>Mis à jour</dt><dd>${esc(C.fmtTs(it.updated_at))}</dd></dl>`;
    } else if (g.tab === 'jalons') {
      const j = rec || {};
      body = `<form class="g" data-form="jalons"><div class="field"><label>Nom (oui / non à une date)<input name="nom" required value="${esc(j.nom || '')}"></label></div>
        <div class="f2"><div class="field"><label>Date cible<input type="date" name="date" required value="${esc(j.date || '')}"></label></div>
        <div class="field"><label>Statut<select name="statut">${Object.keys(STATUT_J).map((k) => opt(k, STATUT_J[k][0], j.statut || 'a_venir')).join('')}</select></label></div></div>
        ${j.date_initiale ? `<p class="muted" style="margin:0">Date initiale conservée : ${C.fmtDate(j.date_initiale)}</p>` : ''}
        <div class="row"><button class="btn" type="submit">${rec ? 'Mettre à jour' : 'Ajouter le jalon'}</button></div></form>`;
    } else if (g.tab === 'risques') {
      const r = rec || {};
      body = `<form class="g" data-form="risques"><div class="field"><label>Titre<input name="titre" required value="${esc(r.titre || '')}"></label></div>
        <div class="f2"><div class="field"><label>Probabilité 1–5${notes('probabilite', r.probabilite)}</label></div><div class="field"><label>Impact 1–5${notes('impact', r.impact)}</label></div></div>
        <div class="field"><label>Mitigation<input name="mitigation" value="${esc(r.mitigation || '')}"></label></div>
        <label style="font-size:12px;display:flex;gap:6px;align-items:center"><input type="checkbox" name="ouvert"${r.ouvert === false ? '' : ' checked'}> ouvert</label>
        <label style="font-size:12px;display:flex;gap:6px;align-items:center"><input type="checkbox" name="portefeuille"${rec && r.item === null ? ' checked' : ''}> risque de portefeuille (non rattaché à l'item)</label>
        <p class="muted" style="margin:0">Échelle risk-scoring-standard PLQ · score = P × I calculé.</p>
        <div class="row"><button class="btn" type="submit">${rec ? 'Mettre à jour' : 'Ajouter le risque'}</button></div></form>`;
    } else if (g.tab === 'attentes') {
      const a = rec || {};
      body = `<form class="g" data-form="attentes"><div class="f2"><div class="field"><label>Tiers (rôle ou personne)<input name="tiers" required value="${esc(a.tiers || '')}"></label></div>
        <div class="field"><label>Attendue le<input type="date" name="attendue_le" required value="${esc(a.attendue_le || '')}"></label></div></div>
        <div class="field"><label>Objet<input name="objet" required value="${esc(a.objet || '')}"></label></div>
        <div class="field"><label>Reçue le (vide = en attente)<input type="date" name="recue_le" value="${esc(a.recue_le || '')}"></label></div>
        <div class="row"><button class="btn" type="submit">${rec ? 'Mettre à jour' : 'Ajouter l\'attente'}</button></div></form>`;
    } else if (g.tab === 'meps') {
      // Manual MEP (Franck 30 Oct.): a deployment no source reports (calendar not shared, verbal announcement)
      const m = rec || {}; const sys = [...new Set(S.base.meps.map((x) => x.systeme).filter(Boolean))].sort();
      body = `<form class="g" data-form="meps"><div class="field"><label>Libellé<input name="libelle" required value="${esc(m.libelle || '')}"></label></div>
        <div class="f2"><div class="field"><label>Date de la MEP<input type="date" name="date" required value="${esc(m.date || '')}"></label></div>
        <div class="field"><label>Statut<select name="statut">${Object.keys(STATUT_MEP).map((k) => opt(k, STATUT_MEP[k][0], m.statut || 'planifiee')).join('')}</select></label></div></div>
        <div class="f2"><div class="field"><label>Système<input name="systeme" required list="mep-sys" value="${esc(m.systeme || '')}" placeholder="G1, G2.1, Extranet Région…"><datalist id="mep-sys">${sys.map((x) => `<option value="${esc(x)}">`).join('')}</datalist></label></div>
        <div class="field"><label>Billet (facultatif)<input name="ticket" value="${esc(m.ticket || '')}" placeholder="SDD-3001, PLQ-9500, GOU21-…"></label></div></div>
        <div class="field"><label>Responsable (facultatif)<input name="responsable" value="${esc(m.responsable || '')}"></label></div>
        <p class="muted" style="margin:0">Une MEP déjà lue (Jira, courriel, Teams, ledger) ne se saisit pas : son billet est refusé ici.</p>
        <div class="row"><button class="btn" type="submit">${rec ? 'Mettre à jour' : 'Ajouter la MEP'}</button></div></form>`;
    } else if (g.tab === 'dependances') {
      const own = [`item:${it.id}`].concat(C.jalonsOf(S.base, it.id).map((j) => `jalon:${j.id}`));
      const all = S.base.items.map((i) => [`item:${i.id}`, `Item · ${i.nom}`]).concat(S.base.jalons.map((j) => [`jalon:${j.id}`, `Jalon · ${itemNom(j.item)} — ${j.nom}`]), S.base.livrables.map((l) => [`livrable:${l.id}`, `Livrable · ${l.nom}`]));
      const lab = (k) => (all.find((a) => a[0] === k) || [k, k])[1];
      body = `<form class="g" data-form="dependances"><div class="field"><label>Personne_05 de cet item<select name="mine">${own.map((k) => opt(k, lab(k), '')).join('')}</select></label></div>
        <div class="f2"><div class="field"><label>Sens<select name="sens">${opt('vers', 'cet item est le successeur', '')}${opt('de', 'cet item est le prédécesseur', '')}</select></label></div>
        <div class="field"><label>Type<select name="type">${['bloque', 'alimente', 'attend'].map((v) => opt(v, v, '')).join('')}</select></label></div></div>
        <div class="field"><label>Autre extrémité<select name="autre">${all.filter((a) => !own.includes(a[0])).map((a) => opt(a[0], a[1], '')).join('')}</select></label></div>
        <div class="field"><label>Note<input name="note"></label></div>
        <div class="row"><button class="btn" type="submit">Ajouter la dépendance</button></div></form>`;
    }
    return `<div class="card top"><span class="eyebrow">Gérer · champs du portefeuille</span>
      <div class="gtabs">${tabs.map(([k, l]) => `<button type="button" class="${g.tab === k ? 'on' : ''}" data-act="gtab" data-t="${k}">${l}</button>`).join('')}</div>
      ${rec ? `<p class="muted" style="margin:8px 0 0">Modification de « ${esc(rec.nom || rec.titre || rec.objet || rec.texte || 'cet enregistrement')} » · <a href="#" data-act="gtab" data-t="${g.tab}">nouveau</a></p>` : ''}
      ${body}${errorsHtml()}
      <p class="muted" style="margin:10px 0 0">Écrit dans la base du portefeuille, jamais dans une source. Les enregistrements d'un feed, de Smartsheet ou du ledger restent en lecture seule.</p></div>`;
  }

  function src() { return { systeme: 'saisie', ref: 'Gérer', lu_le: C.nowTs(), par: 'Franck' }; }
  function ids(col) { return S.base[col].map((r) => r.id); }
  async function submit(kind, f) {
    const v = (k) => (f.get(k) || '').toString().trim();
    const it = S.ix.items[S.itemId];
    if (kind === 'item') {
      const cur = S.creating ? null : it;
      // Freshness of a source item is measured on the source only (decision Franck 2026-10-27)
      const keepTs = cur && cur.source && cur.source.systeme !== 'saisie';
      const rec = Object.assign({}, cur || {}, { nom: v('nom'), type: v('type'), voie: v('voie'), etape: v('etape'), parent: v('parent') || null, promu: !!f.get('promu'), updated_at: keepTs ? cur.updated_at : C.nowTs() });
      if (!cur) { rec.id = C.newId('saisie', rec.nom, ids('items')); rec.source = src(); }
      ['responsable', 'note_lundi'].forEach((k) => { if (v(k)) rec[k] = v(k); else delete rec[k]; });
      if (f.get('visible')) delete rec.visible; else rec.visible = false; // R37: absent = visible
      if (v('valeur') && v('urgence') && v('effort')) { const p = { valeur: +v('valeur'), urgence: +v('urgence'), effort: +v('effort') }; p.score = C.prioriteScore(p); rec.priorite = p; } else delete rec.priorite;
      if (v('debut')) rec.fenetre = { debut: v('debut'), fin: v('fin') || null }; else delete rec.fenetre;
      const ep = v('epics_jira').toUpperCase().split(/[\s,;]+/).filter(Boolean);
      if (ep.length) rec.epics_jira = [...new Set(ep)]; else delete rec.epics_jira;
      const liens = v('liens').split('\n').map((l) => l.split('|').map((s) => s.trim())).filter((x) => x[0] && x[1]).map(([libelle, url]) => ({ libelle, url }));
      if (liens.length) rec.liens = liens; else delete rec.liens;
      delete rec.sante; // computed at display, never written from Gérer (D8)
      if (await write('items', rec)) { S.creating = false; S.itemId = rec.id; S.view = 'projet'; render(); }
      return;
    }
    const cur = S.gerer.id ? S.base[kind].find((r) => r.id === S.gerer.id) : null;
    let rec;
    if (kind === 'jalons') {
      rec = Object.assign({}, cur || { id: C.newId(`saisie.${C.slug(it.id)}`, v('nom'), ids('jalons')), item: it.id }, { nom: v('nom'), date: v('date'), statut: v('statut'), source: src() });
      if (cur && cur.date !== rec.date && !cur.date_initiale) rec.date_initiale = cur.date;
      if (!cur) rec.date_initiale = rec.date;
      if (rec.statut === 'fait' && !rec.fait_le) rec.fait_le = S.today; if (rec.statut !== 'fait') delete rec.fait_le;
    } else if (kind === 'risques') {
      if (!v('probabilite') || !v('impact')) { toast('Probabilité et impact obligatoires', true); return; }
      rec = Object.assign({}, cur || { id: C.newId(`saisie.${C.slug(it.id)}.r`, v('titre'), ids('risques')) }, { item: f.get('portefeuille') ? null : it.id, titre: v('titre'), probabilite: +v('probabilite'), impact: +v('impact'), ouvert: !!f.get('ouvert'), source: src() });
      rec.score = C.risqueScore(rec); if (v('mitigation')) rec.mitigation = v('mitigation'); else delete rec.mitigation;
    } else if (kind === 'attentes') {
      rec = Object.assign({}, cur || { id: C.newId(`saisie.${C.slug(it.id)}.a`, v('tiers') + '-' + v('objet'), ids('attentes')), item: it.id }, { tiers: v('tiers'), objet: v('objet'), attendue_le: v('attendue_le'), recue_le: v('recue_le') || null, source: src() });
    } else if (kind === 'meps') {
      const ticket = v('ticket').toUpperCase().replace(/\s+/g, '');
      // A MEP read from a source is corrected at the source, never duplicated by a manual entry
      const dup = ticket && S.base.meps.find((m) => (m.ticket || '').toUpperCase() === ticket && (!cur || m.id !== cur.id));
      if (dup) { toast(`${ticket} existe déjà (${SYS_FR[dup.source.systeme] || dup.source.systeme}, ${C.fmtDate(dup.date)}) : corrige la source`, true); return; }
      rec = Object.assign({}, cur || { id: C.newId(`saisie.${C.slug(it.id)}.mep`, v('libelle'), ids('meps')), item: it.id }, { date: v('date'), statut: v('statut'), systeme: v('systeme'), libelle: v('libelle'), source: src() });
      ['ticket', 'responsable'].forEach((k) => { const x = k === 'ticket' ? ticket : v(k); if (x) rec[k] = x; else delete rec[k]; });
    } else if (kind === 'dependances') {
      const [mk, mid] = v('mine').split(':'); const [ak, aid] = v('autre').split(':');
      const mine = { kind: mk, id: mid }; const autre = { kind: ak, id: aid };
      const de = v('sens') === 'de' ? mine : autre; const vers = v('sens') === 'de' ? autre : mine;
      rec = { id: C.newId('dep', `${de.id}-${vers.id}`, ids('dependances')), type: v('type'), de, vers, source: src() };
      if (v('note')) rec.note = v('note');
    }
    if (rec && await write(kind, rec)) { S.gerer = { tab: kind, id: null }; render(); }
  }

  // ---------- sprint view ----------
  // R34: tickets ready for the sprint / for grooming, whole GOU21 backlog, in Jira backlog order (Franck)
  // R27 bis (Franck): tickets « Bloqué » in this sprint, parents with their blocked sub-tasks, age from the Jira wait
  function blockedCard(s) {
    const L = (S.base.listes_jira || []).find((x) => x.id === 'jira.liste.bloques');
    const all = L ? L.tickets.filter((t) => (t.sprints || []).includes(s.id)) : [];
    // U22: blocked sub-tasks fold under their blocked parent (counter on the parent line)
    const nTop = all.filter((t) => !t.sous_tache || !all.some((p) => p.cle === t.parent)).length; const nSub = all.length - nTop;
    const head = `<div class="between"><span class="eyebrow" style="color:var(--bad)">Bloqués dans le sprint · ${nTop}${nSub ? ` <span style="text-transform:none;letter-spacing:0">(+ ${nSub} sous-tâche${nSub > 1 ? 's' : ''})</span>` : ''}</span>${freshTag('B1')}</div>`;
    if (!L) return `<div class="card alert">${head}<p class="empty">Liste non lue : le passage quotidien de 9 h la lit dans Jira.</p></div>`;
    if (!all.length) return `<div class="card">${head}<p class="empty">Aucun ticket bloqué dans ce sprint.</p></div>`;
    const tops = all.filter((t) => !t.sous_tache || !all.some((p) => p.cle === t.parent));
    const since = (k) => { const a = S.base.attentes.find((x) => x.id === `jira.att.${k.toLowerCase()}` && !x.recue_le); return a ? C.workingDaysBetween(a.attendue_le, S.today) : null; };
    const line = (t, sub, nk) => { const d = since(t.cle); const op = isOpen('blq:' + t.cle);
      const tg = nk ? `<button class="tg" type="button" data-act="toggle" data-id="blq:${esc(t.cle)}" aria-expanded="${op}" title="${op ? 'Replier' : 'Déplier'} les sous-tâches bloquées" style="width:auto;padding:0 4px">${op ? '▾' : '▸'} ${nk}</button>` : '';
      return `<div class="lrow" style="grid-template-columns:136px minmax(0,1fr) 150px 90px;${sub ? 'padding-left:24px;font-size:12px' : ''}"><span class="row" style="gap:2px;flex-wrap:nowrap">${tg}<a class="tag ${sub ? '' : 'bad'}" href="${JIRA_URL}${esc(t.cle)}" target="_blank" rel="noopener noreferrer" style="justify-self:start">${esc(t.cle)}</a></span><span style="min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="${esc(t.titre)}">${esc(t.titre)}${!sub && t.item ? ` <small class="muted">· ${esc(itemNom(t.item))}</small>` : ''}</span><small class="muted" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(t.assigne || 'non assigné')}</small><span class="tag${d > 5 ? ' warn' : ''}" style="white-space:nowrap;justify-self:end">${d === null ? (sub ? 'sous-tâche' : '—') : d <= 0 ? 'depuis auj.' : `${d} j o.`}</span></div>`; };
    return `<div class="card alert">${head}${tops.map((t) => { const ks = all.filter((x) => x.sous_tache && x.parent === t.cle); return line(t, false, ks.length) + (ks.length && isOpen('blq:' + t.cle) ? ks.map((x) => line(x, true)).join('') : ''); }).join('')}
      <p class="muted" style="margin:8px 0 0">Statut Jira « Bloqué ». Durée = jours ouvrés depuis le premier passage qui l'a vu bloqué (attente du projet).</p></div>`;
  }
  // R32: names of the open support tickets on the portfolio card, grouped by STG21 request (one request may be split
  // into several GOU21 tickets, e.g. FE + BE), sprint shown when planned
  function supportList() {
    const L = (S.base.listes_jira || []).find((x) => x.id === 'jira.liste.support'); if (!L || !L.tickets.length) return '';
    const byReq = {}; L.tickets.forEach((t) => (t.stg21 || ['—']).forEach((k) => (byReq[k] = byReq[k] || []).push(t)));
    const nom = (id) => ((S.ix.sprints[id] || { nom: id }).nom || id).replace(/^G2\.1 - /, '');

    if (['view', 'open-item', 'open-sprint', 'gtab', 'edit', 'new-item', 'toggle', 'expand-all', 'collapse-all', 'focus', 'modal'].includes(a)) e.preventDefault();
    if (a === 'modal') { S.modal = true; S.gerer = { tab: 'item', id: null }; S.errors = []; render(); const m = document.querySelector('.modal input,.modal select'); if (m) m.focus(); return; }
    if (a === 'close-modal') { if (t.classList.contains('modal-bg') && e.target !== t) return; closeModal(); return; }
    if (a === 'focus') { const f = t.dataset.f || null; S.focus = S.focus === f ? null : f; render(); const n = document.querySelector(`.tile[data-f="${f}"],.stage[data-f="${f}"]`); if (n) n.focus(); return; }
    if (a === 'drag') { e.preventDefault(); return; }
    if (a === 'toggle') { const id = t.dataset.id; if (S.toggled.has(id)) S.toggled.delete(id); else S.toggled.add(id); saveToggled(); render(); return; }
    if (a === 'expand-all' || a === 'collapse-all') {
      S.toggled = new Set(a === 'expand-all' ? S.base.items.map((i) => i.id).concat(FOLDED_GRP) : ['grp:hors'].concat(S.base.items.filter((i) => i.type === 'programme').map((i) => 'grp:' + i.id)));
      saveToggled(); render(); return;
    }
    if (a === 'view') { S.view = t.dataset.v; S.creating = false; S.modal = false; if (S.view === 'projet' && !S.itemId) { const f = S.base.items.find((i) => i.etape === 'actif' && i.type === 'projet'); S.itemId = f && f.id; } }
    else if (a === 'open-item') { S.view = 'projet'; S.itemId = t.dataset.id; S.creating = false; S.modal = false; S.gerer = { tab: 'item', id: null }; S.errors = []; }
    else if (a === 'open-sprint') { S.view = 'sprint'; S.sprintId = t.dataset.id; }
    else if (a === 'gantt-tab') { e.preventDefault(); S.ganttTab[S.itemId] = +t.dataset.k; render(); const b = document.querySelector(`[data-act="gantt-tab"][data-k="${t.dataset.k}"]`); if (b) b.focus(); return; }
    else if (a === 'gtab') { S.gerer = { tab: t.dataset.t, id: null }; S.errors = []; if (S.modal) { render(); const n = document.querySelector(`.modal [data-act="gtab"][data-t="${t.dataset.t}"]`); if (n) n.focus(); return; } }
    else if (a === 'edit') { S.gerer = { tab: t.dataset.col, id: t.dataset.id }; S.errors = []; S.modal = true; render(); return; }
    else if (a === 'new-item') { S.view = 'projet'; S.creating = true; S.errors = []; }
    // R38: owner previews the page as a visitor (no Gérer, no buttons, hidden items filtered); second click returns
    else if (a === 'visitor') { e.preventDefault(); S.visitor = !S.visitor; S.modal = false; S.focus = null; S.canEdit = S.ownerEdit && !S.visitor; S.creating = false; applyView(); if (S.itemId && !S.ix.items[S.itemId]) { S.view = 'portefeuille'; S.itemId = null; } }
    // R40: owner marks a retro action done / reopens it; only `statut` changes (same rule as skill maj-actions-retro)
    else if (a === 'retro') {
      e.preventDefault(); if (!S.canEdit || !S.db) { toast('Lecture seule', true); return; }
      const cur = S.base.actions_retro.find((x) => x.id === t.dataset.id); if (!cur) return;
      t.disabled = true; write('actions_retro', Object.assign({}, cur, { statut: t.dataset.st })); return;
    }
    else return;
    render(); window.scrollTo(0, 0);
  });
  // R17 drag and drop of portfolio rows (same section only)
  const clearDrop = () => document.querySelectorAll('.drop-before,.drop-after,.dragging').forEach((x) => x.classList.remove('drop-before', 'drop-after', 'dragging'));
  document.addEventListener('dragstart', (e) => {
    const h = e.target.closest && e.target.closest('[data-act="drag"]'); if (!h) return;
    S.drag = h.dataset.id; const row = h.closest('.tlr'); if (row) row.classList.add('dragging');
    try { e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', S.drag); } catch (err) { /* ignore */ }
  });
  document.addEventListener('dragover', (e) => {
    if (!S.drag) return; const row = e.target.closest && e.target.closest('.tlr[data-row]'); if (!row || row.dataset.row === S.drag) return;
    const a = S.ix.items[S.drag]; const b = S.ix.items[row.dataset.row]; if (!a || !b || (a.parent || null) !== (b.parent || null)) return;
    e.preventDefault(); const r = row.getBoundingClientRect(); const after = e.clientY > r.top + r.height / 2;
    document.querySelectorAll('.drop-before,.drop-after').forEach((x) => x.classList.remove('drop-before', 'drop-after'));
    row.classList.add(after ? 'drop-after' : 'drop-before');
  });
  document.addEventListener('drop', (e) => {
    if (!S.drag) return; const row = e.target.closest && e.target.closest('.tlr[data-row]'); const id = S.drag;
    const after = !!(row && row.classList.contains('drop-after')); S.drag = null; clearDrop();
    if (row && row.dataset.row !== id) { e.preventDefault(); reorder(id, row.dataset.row, after); }
  });
  document.addEventListener('dragend', () => { S.drag = null; clearDrop(); });
  // U15 (fresh review): focus returns to « Modifier » on close; Tab stays inside the dialog
  function closeModal() { S.modal = false; S.errors = []; render(); const b = document.querySelector('[data-act="modal"]'); if (b) b.focus(); }
  document.addEventListener('keydown', (e) => {
    if (!S.modal) return; if (e.key === 'Escape') { closeModal(); return; }
    if (e.key !== 'Tab') return; const m = document.querySelector('.modal'); if (!m) return;
    const f = [...m.querySelectorAll('button,input,select,textarea,a[href]')].filter((x) => !x.disabled && x.type !== 'hidden'); if (!f.length) return;
    const first = f[0]; const last = f[f.length - 1];
    if (!m.contains(document.activeElement)) { e.preventDefault(); first.focus(); }
    else if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  });
  // U09: tiles and stages are role=button: Enter / Space activate them
  document.addEventListener('keydown', (e) => {
    const b = e.target.closest && e.target.closest('[role="button"][data-act="focus"]'); if (!b || !['Enter', ' '].includes(e.key)) return;
    e.preventDefault(); b.click();
  });
  document.addEventListener('keydown', (e) => {
    const h = e.target.closest && e.target.closest('[data-act="drag"]'); if (!h || !['ArrowUp', 'ArrowDown'].includes(e.key)) return;
    e.preventDefault(); const id = h.dataset.id; Promise.resolve(move(id, e.key === 'ArrowUp' ? -1 : 1)).then(() => { const n = document.querySelector(`[data-act="drag"][data-id="${id}"]`); if (n) n.focus(); });
  });
  document.addEventListener('change', (e) => {
    const t = e.target; if (t.dataset && t.dataset.act === 'filter') { S.filters[t.dataset.f] = t.value; render(); }
  });
  document.addEventListener('submit', async (e) => {
    const f = e.target.closest('form[data-form]'); if (!f) return; e.preventDefault();
    if (!S.canEdit || !S.db) { toast('Lecture seule', true); return; }
    const btn = f.querySelector('[type=submit]'); if (btn) btn.disabled = true;
    try { await submit(f.dataset.form, new FormData(f)); } finally { if (btn) btn.disabled = false; }
  });

  async function init() {
    render();
    const use = window.claude && typeof window.claude.use === 'function' ? window.claude.use.bind(window.claude) : null;
    if (!use) { S.status = 'indisponible'; S.diag = ['window.claude absent']; render(); return; }
    const [db, user] = await Promise.all([use('db').catch(() => null), use('user').catch(() => null)]);
    try { S.ownerEdit = user ? !!(await user.canEdit()) : false; } catch (e) { S.ownerEdit = false; }
    S.canEdit = S.ownerEdit;
    if (!db) { S.status = 'indisponible'; S.diag = ['use("db") = null']; render(); return; }
    // Deep link: #projet/<id> or #sprint/<id> (used by the Monday digest at step 4)
    const m = (location.hash || '').match(/^#(projet|sprint)\/(.+)$/);
    if (m) { S.view = m[1]; if (m[1] === 'projet') S.itemId = decodeURIComponent(m[2]); else S.sprintId = decodeURIComponent(m[2]); }
    S.db = db; await load();
  }
  init();
})();
</script>
